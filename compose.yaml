x-app-image: &app-image
  image: forex-factory-mvp:local

services:
  chrome:
    <<: *app-image
    build:
      context: .
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        rm -f /tmp/.X99-lock /app/chrome-profile/Singleton*
        Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp -ac &
        xvfb_pid=$$!
        trap 'kill "$$xvfb_pid" 2>/dev/null || true' EXIT
        for attempt in {1..50}; do
          if xdpyinfo -display :99 >/dev/null 2>&1; then
            export DISPLAY=:99
            exec bash scripts/start_chrome.sh
          fi
          kill -0 "$$xvfb_pid" 2>/dev/null
          sleep 0.1
        done
        echo "Xvfb did not become ready" >&2
        exit 1
    environment:
      CHROME_CONTAINER_MODE: "1"
      CHROME_REMOTE_DEBUGGING_ADDRESS: 127.0.0.1
    volumes:
      - chrome-profile:/app/chrome-profile
    tmpfs:
      - /tmp/.X11-unix:mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9222/json/version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - 127.0.0.1:${APP_PORT:-8000}:8000
    restart: unless-stopped

  api:
    <<: *app-image
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY in .env}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:?Set MOONSHOT_API_KEY in .env}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.kimi.com/coding/v1}
      KIMI_MODEL: ${KIMI_MODEL:-k3-256k}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-120}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-30}
      CALENDAR_SOURCE_TIMEZONE: ${CALENDAR_SOURCE_TIMEZONE:-Asia/Singapore}
      CALENDAR_HORIZON_DAYS: ${CALENDAR_HORIZON_DAYS:-8}
      CALENDAR_SCHEDULE_INTERVAL_SECONDS: ${CALENDAR_SCHEDULE_INTERVAL_SECONDS:-600}
      NEWS_SOURCE_TIMEZONE: ${NEWS_SOURCE_TIMEZONE:-Asia/Shanghai}
      NEWS_DETAIL_INTERVAL_SECONDS: ${NEWS_DETAIL_INTERVAL_SECONDS:-2}
      NEWS_DETAIL_MAX_ATTEMPTS: ${NEWS_DETAIL_MAX_ATTEMPTS:-8}
      NEWS_SNAPSHOT_DIR: /app/data/snapshots
      NEWS_SNAPSHOT_RETENTION_DAYS: ${NEWS_SNAPSHOT_RETENTION_DAYS:-30}
      NEWS_MEDIA_DIR: /app/data/media
      NEWS_MEDIA_MAX_BYTES: ${NEWS_MEDIA_MAX_BYTES:-10485760}
      NEWS_BACKFILL_DAYS: ${NEWS_BACKFILL_DAYS:-30}
      DATABASE_PATH: /app/data/forex_factory.sqlite3
      CDP_URL: http://127.0.0.1:9222
    depends_on:
      chrome:
        condition: service_healthy
    network_mode: "service:chrome"
    volumes:
      - database:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  chrome-profile:
  database:
